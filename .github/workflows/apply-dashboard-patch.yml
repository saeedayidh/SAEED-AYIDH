name: Apply dashboard security patch

on:
  push:
    branches: [main]
    paths:
      - '.sba-patch/**'
      - '.github/workflows/apply-dashboard-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dashboard patch
        shell: bash
        run: |
          if ! ls .sba-patch/part* >/dev/null 2>&1; then
            echo "No patch parts; nothing to do."
            exit 0
          fi
          cat .sba-patch/part* > /tmp/dashboard-patch.b64
          base64 -d /tmp/dashboard-patch.b64 > /tmp/dashboard-patch.tgz
          tar -xzf /tmp/dashboard-patch.tgz -C .
          rm -rf .sba-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: sync secure admin dashboard"
          git push
